<!DOCTYPE html>
<html>
<head>
    <title>Fish Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #0288d1;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        .fish {
            background-color: white;
            width: 250px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        .fish h2 {
            color: #0288d1;
        }

        footer {
            background-color: #01579b;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🐟 Fish Information</h1>
        <p>Learn About Different Types of Fish</p>
    </header>

    <div class="fish">
        <h2>🐠 Clownfish</h2>
        <p>Clownfish are small and colorful marine fish.</p>
    </div>

    <div class="fish">
        <h2>🐡 Pufferfish</h2>
        <p>Pufferfish can inflate their bodies when they feel threatened.</p>
    </div>

    <div class="fish">
        <h2>🦈 Shark</h2>
        <p>Sharks are large marine fish with powerful bodies.</p>
    </div>

    <footer>
        <p>© 2026 Fish Information</p>
    </footer>

</body>
</html>
